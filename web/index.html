<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loafer Watch</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="/static/icon.svg"
    >
</head>

<body>

    <main class="container">

        <header>
            <h1>ESS homework submission page</h1>

            <div id="connection-status" class="status-disconnected">
                <span id="status-dot"></span>
                <span id="status">Disconnected</span>
            </div>

            <div id="role-status" class="hidden">
                <span id="role-label"></span>
            </div>
        </header>

        <section id="login">

            <input
                id="token"
                type="password"
                placeholder="Enter access token"
                autocomplete="off"
            >

            <button id="connect">
                Connect
            </button>

            <p id="error"></p>

        </section>


        <section id="client" class="hidden">

            <div id="alert-display">

                <div id="alert-icon">🟢</div>

                <h2 id="alert-title">
                    Coast clear
                </h2>

                <p id="alert-message">
                    Waiting for an alert...
                </p>

            </div>
            <div id="last-alert" class="last-alert hidden">
                <span class="last-alert-label">Last alert</span>
                <strong id="last-alert-title">—</strong>
                <span id="last-alert-time">—</span>
            </div>

        </section>


        <section id="lookout" class="hidden">

            <h2>Lookout Controls</h2>

            <button data-event="WARDEN_ENTERED">
                🔴 Warden entered
            </button>

            <button data-event="WARDEN_STOOD_UP">
                🟠 Warden stood up
            </button>

            <button data-event="WARDEN_LOOKING">
                🟡 Warden looking
            </button>

            <button data-event="COAST_CLEAR">
                🟢 Coast clear
            </button>

            <button data-event="WARDEN_LEFT">
                🟢 Warden left
            </button>

            <div id="last-sent" class="last-alert hidden">
                <span class="last-alert-label">Last sent</span>
                <strong id="last-sent-title">—</strong>
                <span id="last-sent-time">—</span>
            </div>

        </section>

    </main>

    <script src="/static/app.js"></script>

</body>
</html>
